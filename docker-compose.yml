services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: jchat-postgres
    restart: "no"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jchat
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jchat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
